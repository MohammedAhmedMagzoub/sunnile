<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="1128" height="191">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D3D5C"/>
      <stop offset="60%" style="stop-color:#0D3D5C"/>
      <stop offset="100%" style="stop-color:#1A5C3A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF9F27;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#EF9F27;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="1128" height="191" fill="url(#bg)"/>

  <!-- Subtle glow circle top left -->
  <circle cx="120" cy="95" r="160" fill="url(#glow)"/>

  <!-- Sun rays -->
  <g transform="translate(110,95)" stroke="#EF9F27" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="0" y1="-44" x2="0" y2="-54"/>
    <line x1="31" y1="-31" x2="38" y2="-38"/>
    <line x1="44" y1="0" x2="54" y2="0"/>
    <line x1="31" y1="31" x2="38" y2="38"/>
    <line x1="0" y1="44" x2="0" y2="54"/>
    <line x1="-31" y1="31" x2="-38" y2="38"/>
    <line x1="-44" y1="0" x2="-54" y2="0"/>
    <line x1="-31" y1="-31" x2="-38" y2="-38"/>
  </g>

  <!-- Sun -->
  <circle cx="110" cy="95" r="32" fill="#EF9F27"/>
  <circle cx="110" cy="95" r="23" fill="#0D3D5C"/>
  <circle cx="110" cy="95" r="17" fill="#EF9F27"/>

  <!-- Arabic title -->
  <text x="200" y="85" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#EF9F27">شمس النيل</text>

  <!-- English subtitle -->
  <text x="200" y="122" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#A89F8C" letter-spacing="2">SunNile — Sudan's Rooftop Solar Initiative</text>

  <!-- Right side tagline -->
  <text x="1080" y="88" font-family="Arial, sans-serif" font-size="14" fill="#6B9FBF" text-anchor="end" letter-spacing="1">sunnile.org</text>
  <text x="1080" y="112" font-family="Arial, sans-serif" font-size="13" fill="#5A7A8A" text-anchor="end">Free Solar Knowledge for Sudan</text>

  <!-- Bottom line accent -->
  <rect x="200" y="138" width="480" height="2" fill="#EF9F27" opacity="0.4" rx="1"/>
</svg>
